description: "World 3 — Firefly Garden: thousands of fireflies, play them like an instrument"
nodes:
  - id: about
    type: comment
    action: "FIREFLY GARDEN — playful. Fireflies swarm towards the pointer (custom ports x/y on the particles node). Every tap releases a burst in a colour that matches the note it plays (C major pentatonic, pluck subgraph). A wind of filtered pink noise follows the pointer."
    position: { x: 40, y: 40 }
    size: { width: 620, height: 160 }
    inputs: []
    outputs: []
  - id: active_in
    type: graph-input
    action: true while this world is on screen (the director sets it)
    position: { x: 40, y: 240 }
    inputs: []
    outputs:
      - name: active
        connection: on.a
  - id: x_in
    type: graph-input
    action: "Pointer x 0..1 (the real mouse, or the ghost pointer in attract mode)"
    position: { x: 40, y: 460 }
    inputs: []
    outputs:
      - name: x
        connection:
          - pluck.brightness
          - swarm.x
          - windsweep.value
  - id: y_in
    type: graph-input
    action: "Pointer y 0..1, 0 = top"
    position: { x: 40, y: 680 }
    inputs: []
    outputs:
      - name: "y"
        connection:
          - ambient.value
          - swarm.y
  - id: tap_in
    type: graph-input
    action: A bang on every click / tap / space bar (or a ghost tap in attract mode)
    position: { x: 40, y: 900 }
    inputs: []
    outputs:
      - name: tap
        connection:
          - pick.trigger
          - pluck.gate
          - swarm.emit
  - id: on
    type: math/math
    action: "active ? 1 : 0"
    position: { x: 40, y: 1120 }
    inputs:
      - name: a
        connection: active_in.active
      - name: b
        connection: ""
      - name: c
        connection: ""
    outputs:
      - name: result
        connection: fade.target
  - id: fade
    type: time/tween
    action: "1.2 s easeInOutSine fade between 0 and 1"
    position: { x: 420, y: 1120 }
    inputs:
      - name: target
        connection: on.result
      - name: duration
        connection: ""
      - name: easing
        connection: ""
    outputs:
      - name: value
        connection:
          - awake.a
          - swarm.fade
          - fader.gain
  - id: awake
    type: math/math
    action: "a > 0.001 (true while the world is visible or fading)"
    position: { x: 800, y: 1120 }
    inputs:
      - name: a
        connection: fade.value
      - name: b
        connection: ""
      - name: c
        connection: ""
    outputs:
      - name: result
        connection: swarm.awake
  - id: pick
    type: math/random
    action: Whole number 0..9 on every tap
    position: { x: 420, y: 900 }
    inputs:
      - name: trigger
        connection: tap_in.tap
      - name: min
        connection: ""
      - name: max
        connection: ""
    outputs:
      - name: value
        connection:
          - scale.a
          - hue.a
  - id: scale
    type: math/math
    action: "Degree a of the C major pentatonic scale from C4 (C D E G A, next octave from 5) → MIDI → Hz"
    position: { x: 800, y: 900 }
    inputs:
      - name: a
        connection: pick.value
      - name: b
        connection: ""
      - name: c
        connection: ""
    outputs:
      - name: result
        connection: pluck.frequency
  - id: hue
    type: math/math
    action: "CSS colour for the note: hsl(a × 36 + 20, 95%, 65%) — low notes warm amber, high notes cool cyan/violet"
    position: { x: 800, y: 1120 }
    inputs:
      - name: a
        connection: pick.value
      - name: b
        connection: ""
      - name: c
        connection: ""
    outputs:
      - name: result
        connection: swarm.color
  - id: pluck
    type: subgraph
    graph: worlds/lib/pluck
    action: Bright marimba-like pluck; pointer x = brightness
    position: { x: 1180, y: 900 }
    inputs:
      - name: frequency
        connection: scale.result
      - name: gate
        connection: tap_in.tap
      - name: brightness
        connection: x_in.x
    outputs:
      - name: signal
        connection: mix.a
  - id: ambient
    type: math/map-range
    action: Pointer y 0..1 → 60..10 fireflies/s (more near the top)
    position: { x: 420, y: 460 }
    inputs:
      - name: value
        connection: y_in.y
      - name: in-min
        connection: ""
      - name: in-max
        connection: ""
      - name: out-min
        connection: ""
      - name: out-max
        connection: ""
    outputs:
      - name: value
        connection: swarm.rate
  - id: swarm
    type: graphics/particles
    action: "Full-screen firefly garden at night: a deep indigo → near-black vertical gradient with soft dark grass silhouettes along the bottom (draw them once into an offscreen canvas). A steady stream of fireflies (rate) wanders on curl-noise paths, glowing yellow-green, blinking slowly, and drifts towards the attractor point (x, y). Each emit = a burst of 120 sparks from the attractor in the current colour, flying outward with drag, then settling into ordinary wandering fireflies that slowly turn yellow-green again. Additive glow. Pause the simulation when awake is false; multiply the overall opacity by fade."
    position: { x: 1560, y: 240 }
    inputs:
      - name: emit
        connection: tap_in.tap
      - name: rate
        connection: ambient.value
      - name: color
        connection: hue.result
      - name: x
        connection: x_in.x
        description: "Attractor x 0..1 — fireflies drift toward it, bursts start here"
      - name: "y"
        connection: y_in.y
        description: Attractor y 0..1 (0 = top)
      - name: fade
        connection: fade.value
        description: "World fade 0..1: overall opacity"
      - name: awake
        connection: awake.result
        description: false = pause the simulation (world hidden)
    outputs:
      - name: element
        connection: element_out.element
  - id: noise
    type: audio/noise
    action: Pink noise
    position: { x: 420, y: 1560 }
    inputs:
      - name: color
        connection: ""
    outputs:
      - name: signal
        connection: windfilter.signal
  - id: windsweep
    type: math/map-range
    action: Pointer x 0..1 → 250..2500 Hz
    position: { x: 420, y: 1780 }
    inputs:
      - name: value
        connection: x_in.x
      - name: in-min
        connection: ""
      - name: in-max
        connection: ""
      - name: out-min
        connection: ""
      - name: out-max
        connection: ""
    outputs:
      - name: value
        connection: windfilter.cutoff
  - id: windfilter
    type: audio/filter
    action: "Band-pass, resonance 4: a soft whistling wind"
    position: { x: 800, y: 1560 }
    inputs:
      - name: signal
        connection: noise.signal
      - name: cutoff
        connection: windsweep.value
      - name: resonance
        connection: ""
      - name: type
        connection: ""
    outputs:
      - name: signal
        connection: windgain.signal
  - id: windgain
    type: audio/gain
    action: "Quiet: 0.06"
    position: { x: 1180, y: 1560 }
    inputs:
      - name: signal
        connection: windfilter.signal
      - name: gain
        connection: ""
    outputs:
      - name: signal
        connection: mix.b
  - id: mix
    type: audio/mixer
    action: "Pluck 0.9, wind 1.0"
    position: { x: 1560, y: 1120 }
    inputs:
      - name: a
        connection: pluck.signal
      - name: b
        connection: windgain.signal
      - name: c
        connection: ""
      - name: d
        connection: ""
    outputs:
      - name: signal
        connection: space.signal
  - id: spacewet
    type: data/value
    action: "0.5"
    position: { x: 1560, y: 1560 }
    inputs: []
    outputs:
      - name: value
        connection: space.space
  - id: space
    type: subgraph
    graph: worlds/lib/space-fx
    action: Open night air
    position: { x: 1940, y: 1120 }
    inputs:
      - name: signal
        connection: mix.signal
      - name: space
        connection: spacewet.value
    outputs:
      - name: signal
        connection: fader.signal
  - id: fader
    type: audio/gain
    action: Fades the whole world in and out with the crossfade
    position: { x: 2320, y: 1120 }
    inputs:
      - name: signal
        connection: space.signal
      - name: gain
        connection: fade.value
    outputs:
      - name: signal
        connection: signal_out.signal
  - id: signal_out
    type: graph-output
    action: "The world's sound"
    position: { x: 2700, y: 1120 }
    inputs:
      - name: signal
        connection: fader.signal
    outputs: []
  - id: element_out
    type: graph-output
    action: "The world's full-screen visual"
    position: { x: 2700, y: 1560 }
    inputs:
      - name: element
        connection: swarm.element
    outputs: []
